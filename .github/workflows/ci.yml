name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      - name: test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...

      # Floor set a couple of points under the measured total (85.5% at the
      # time), so ordinary churn passes but a change that lands a swath of
      # untested code does not. Raise it as the total grows.
      - name: coverage gate
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{sub(/%/, "", $NF); print $NF}')
          echo "total coverage: ${total}% (floor: 83.0%)"
          awk -v t="$total" 'BEGIN { if (t < 83.0) { print "coverage is below the floor"; exit 1 } }'

      - name: build
        run: CGO_ENABLED=0 go build ./cmd/janus

      - name: shellcheck
        run: shellcheck deploy/*.sh

      - name: validate systemd unit
        run: |
          if grep -nE '^[A-Za-z][A-Za-z0-9]*=.*[[:space:]]#' deploy/*.service; then
            echo "systemd directives must not have trailing inline comments — systemd parses them into the value and silently ignores the setting; move the comment to its own line" >&2
            exit 1
          fi

      - name: validate dogfood pipeline
        run: |
          if [ -f .janus/ci.yml ]; then
            go run ./cmd/janus validate .janus/ci.yml
          else
            echo "no .janus/ci.yml yet (added in a later phase)"
          fi

      - name: validate example pipelines
        run: |
          for f in examples/*.yml; do
            [ -f "$f" ] || continue
            go run ./cmd/janus validate "$f"
          done

  # Proves execution works on native Windows: the per-OS shell resolution,
  # cmd/powershell steps, and the taskkill process-tree kill. The exec-heavy
  # server/workspace/runner suites carry unix output assumptions and are left to
  # the ubuntu job for now (broadening them to Windows is a follow-up).
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: build
        env:
          CGO_ENABLED: "0" # env key, not an inline prefix: this job's shell is PowerShell
        run: go build ./cmd/janus

      - name: test (engine + pipeline + pure packages)
        run: go test ./internal/engine/ ./internal/pipeline/ ./internal/config/ ./internal/store/ ./internal/allowlist/ ./internal/provider/
