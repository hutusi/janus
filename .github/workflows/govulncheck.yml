name: govulncheck

# The schedule is the point: a vulnerability disclosed while the repo is quiet
# should surface without waiting for the next push. Push/PR runs are the cheap
# extra — they catch a dependency change that introduces a known-vulnerable
# version at review time.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday 06:17 UTC

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod # resolves the toolchain directive
          cache: true

      # Explicit steps rather than golang/govulncheck-action: the action
      # installs govulncheck@latest, an unpinned executable in an otherwise
      # SHA-pinned workflow. The version pin trades scanner freshness for
      # review-controlled updates; findings stay fresh regardless, because the
      # vulnerability database is fetched live on every run.
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: govulncheck
        run: govulncheck ./...
