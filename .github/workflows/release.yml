name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false # publish job: don't reuse shared cache (poisoning surface)

      # Gate publication on the suite passing. A tag can point at any commit,
      # including one that never went through ci.yml, and a release is not
      # retractable once the binaries are up — so the tests run here too rather
      # than being assumed from the branch. `-race` stays ci.yml's job: it is
      # enforced on every push to main and every PR, and tags are cut from main.
      - name: Test
        run: go test ./...

      - name: Build cross-platform binaries
        env:
          VERSION: ${{ github.ref_name }} # the tag, e.g. v0.1.0
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}
            out="janus-${os}-${arch}"
            [ "$os" = windows ] && out="${out}.exe"
            echo "building dist/${out}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
                -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT:0:7}" \
                -o "dist/${out}" ./cmd/janus
          done

      - name: Checksums
        working-directory: dist
        run: sha256sum janus-* > checksums.txt

      - name: Extract changelog section
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          ver="${VERSION#v}"
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            /^## \[/ {flag=0}
            /^\[[^]]+\]:/ {flag=0}
            flag {print}
          ' CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || echo "Release ${VERSION}." > dist/notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease";; esac
          gh release create "$VERSION" $prerelease \
            --verify-tag \
            --title "$VERSION" \
            --notes-file dist/notes.md \
            dist/janus-* dist/checksums.txt
