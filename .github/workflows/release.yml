name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build cross-platform binaries
        env:
          VERSION: ${{ github.ref_name }} # the tag, e.g. v0.1.0
        run: |
          mkdir -p dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${t%/*}; arch=${t#*/}
            out="janus-${os}-${arch}"
            echo "building dist/${out}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
                -ldflags "-s -w -X main.version=${VERSION}" \
                -o "dist/${out}" ./cmd/janus
          done

      - name: Checksums
        working-directory: dist
        run: sha256sum janus-* > checksums.txt

      - name: Extract changelog section
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          ver="${VERSION#v}"
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            /^## \[/ {flag=0}
            /^\[[^]]+\]:/ {flag=0}
            flag {print}
          ' CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || echo "Release ${VERSION}." > dist/notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease";; esac
          gh release create "$VERSION" $prerelease \
            --verify-tag \
            --title "$VERSION" \
            --notes-file dist/notes.md \
            dist/janus-* dist/checksums.txt
