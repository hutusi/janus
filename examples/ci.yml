# One pipeline for every branch (the default .janus/ci.yml): build always,
# release only on master/main.
#
# GitLab sends a Push Hook for each pushed branch; `on: push` with no filter
# accepts them all. The `deploy` job carries a job-level branch filter
# (`branches: [master, main]`) — on any other branch it is recorded as
# `skipped` while `build` still runs, so one file replaces a build/release
# pipeline pair with no duplicated build job.
#
# Releases fire on a push to master/main (e.g. a merged merge request). Janus
# ignores the GitLab MR "merge" action and fires on the resulting push, and it
# can't tell a merge-commit push from a direct push — enforce "merged MR only"
# with branch protection. All jobs in a run share one workspace directory, so
# `deploy` sees the `out/` produced by `build`.
#
# Auth: Janus forwards only PATH/HOME/LANG/LC_ALL/TZ/TMPDIR to steps (no
# secrets, no SSH_AUTH_SOCK). Configure a passphraseless SSH deploy key for the
# Janus host user (~/.ssh) with push access to PAGES_REPO_URL. The URL/branch
# below are not secrets. The PAGES_BRANCH must already exist in the pages repo.
name: ci
on:
  push: {}
env:
  OUT_DIR: out            # build output directory to verify
  PAGES_REPO_URL: "git@gitlab.example.com:your-group/your-pages.git"
  PAGES_BRANCH: "main"
  GIT_USER_NAME: "Janus CI"
  GIT_USER_EMAIL: "ci@example.com"
jobs:
  build:
    steps:
      # The workspace is already the exact verified commit of this event
      # (shallow, detached HEAD) — build it as-is so ${{ sha }} / JANUS_SHA
      # always identify what ran; a newer push triggers its own run.
      # Install dependencies and build.
      - run: npm install && npm run build
      # Verify the build output exists and is non-empty.
      - run: |
          set -e
          test -d "$OUT_DIR"
          [ -n "$(ls -A "$OUT_DIR")" ]
  deploy:
    needs: [build]
    branches: [master, main]
    steps:
      # Update the pages repo: a fresh shallow clone of the target branch.
      - run: |
          set -e
          rm -rf .pages-repo
          git clone --depth 1 --branch "$PAGES_BRANCH" "$PAGES_REPO_URL" .pages-repo
          git -C .pages-repo config user.name "$GIT_USER_NAME"
          git -C .pages-repo config user.email "$GIT_USER_EMAIL"
      # Copy the build output in, overwriting existing content (including deletions).
      - run: |
          set -e
          find .pages-repo -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          if [ -e "$OUT_DIR/.git" ]; then
            echo "refusing to deploy: $OUT_DIR/.git would clobber the pages repo metadata" >&2
            exit 1
          fi
          cp -R "$OUT_DIR"/. .pages-repo/
      # Commit the changes (skip cleanly if nothing changed).
      - run: |
          set -e
          git -C .pages-repo add -A
          git -C .pages-repo diff --cached --quiet || \
            git -C .pages-repo commit -m "Deploy ${{ short_sha }} from ${{ branch }}"
      # Push to the pages repo.
      - run: git -C .pages-repo push origin HEAD:"$PAGES_BRANCH"
