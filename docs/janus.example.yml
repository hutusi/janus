# Example Janus server config. Pass with: janus serve --config janus.yml
#
# Every key is optional; omitted keys fall back to the built-in defaults shown
# below. CLI flags and the JANUS_* env vars override these values.
# Keep this file readable only by the janus user (chmod 600) if it holds secrets.

addr: ":8080"                       # HTTP listen address
data_dir: "/var/lib/janus"          # persistent run history (empty = in-memory, lost on restart)
workspace_root: "/var/lib/janus/workspaces"  # per-run checkouts (default: $TMPDIR/janus-workspaces)
pipeline_path: ".janus/ci.yml"      # in-repo path to the pipeline file

max_parallel_jobs: 4                # jobs running concurrently within a run
max_parallel_runs: 4                # runs executing concurrently
step_timeout: "0s"                  # fail a step that runs longer than this (0 = no timeout), e.g. "10m"
keep_workspaces: false              # keep workspaces after runs (debugging)

# Secrets — prefer the JANUS_GITLAB_SECRET / JANUS_API_TOKEN env vars over the file.
gitlab_secret: ""                   # enables POST /webhooks/gitlab when set
api_token: ""                       # bearer token for /api/* ; POST /api/trigger requires it
