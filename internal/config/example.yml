# Example Janus server config. Pass with: janus serve --config janus.yml
# (janus serve also auto-loads ./janus.yml if present and --config is unset).
#
# Every key is optional; omitted keys fall back to the built-in defaults shown
# below. CLI flags and the JANUS_* env vars override these values.
# Keep this file readable only by the janus user (chmod 600) if it holds secrets.

addr: ":8080"                       # HTTP listen address
# Paths below are created on demand (no sudo). For a system service, run as a
# dedicated janus user and use absolute paths, e.g. /var/lib/janus.
data_dir: "./janus-data"            # persistent run history (empty = in-memory, lost on restart)
workspace_root: "./janus-data/workspaces"  # per-run checkouts (default: $TMPDIR/janus-workspaces)
pipeline_path: ".janus/ci.yml"      # in-repo path to the pipeline file

max_parallel_jobs: 4                # jobs running concurrently within a run
max_parallel_runs: 4                # runs executing concurrently
history_limit: 1000                 # max terminal runs to retain; oldest + their logs are pruned after each run and at startup (0 = unlimited)
step_timeout: "0s"                  # fail a step that runs longer than this (0 = no timeout), e.g. "10m"
keep_workspaces: false              # keep workspaces after runs (debugging)
workspace_strategy: "fresh"         # "fresh" = new dir per run; "persistent" = one reusable dir per repo; "mirror" = per-repo bare-mirror cache, fresh dir per run
                                    # (fetch + reset in place; caches like node_modules survive — faster, not hermetic)
clone_url: "http"                   # which clone URL from the webhook payload to check out: "http" or "ssh"
                                    # ("ssh" needs a key + known_hosts for the service user, and allow_repos
                                    #  entries written in the SSH form the platform sends)

# Secrets — prefer the JANUS_GITLAB_SECRET / JANUS_GITHUB_SECRET / JANUS_API_TOKEN
# env vars over the file.
gitlab_secret: ""                   # enables POST /webhooks/gitlab when set
# github_secret: ""                 # enables POST /webhooks/github when set (HMAC-verified)
# gitee_secret: ""                  # enables POST /webhooks/gitee when set (password or signature)
# gitcode_secret: ""                # enables POST /webhooks/gitcode when set (token or signature)
api_token: ""                       # bearer token for /api/* ; POST /api/trigger requires it

# GitLab commit-status reporting: report a run's state back to the commit/MR.
# Set an API token (personal/project access token, "api" scope) to enable it.
# Prefer the JANUS_GITLAB_API_TOKEN env var over the file.
# gitlab_api_token: ""              # outbound token; distinct from gitlab_secret (the inbound webhook token)
# gitlab_url: ""                    # GitLab base URL; derived from the clone URL for clone_url "http",
                                    # required for "ssh" or a self-hosted subpath, e.g. "https://gitlab.example.com"

# GitHub commit-status reporting: report a run's state back to the commit/PR.
# Set a token with the "repo:status" scope to enable it.
# Prefer the JANUS_GITHUB_API_TOKEN env var over the file.
# github_api_token: ""             # outbound token; distinct from github_secret (the inbound webhook secret)
# github_url: ""                   # GitHub Enterprise Server web base, e.g. "https://github.example.com"
                                    # (leave empty for github.com; the /api/v3 prefix is added automatically)

# Repositories allowed to run. DENY BY DEFAULT: an empty/omitted list rejects
# every webhook and manual trigger (403). Use a single "*" to allow all.
# Entries are scheme-aware URL prefixes with a path boundary, so a host- or
# group-level entry permits everything beneath it.
allow_repos:
  - "https://gitlab.example.com/acme"
  # - "*"   # allow any repository

# Public base URL of this daemon. When set, notifications include a link to the
# run page (<base_url>/runs/<id>). Leave empty to omit the link.
# base_url: "https://ci.example.com"

# Outbound notifications: POST a JSON run summary to each endpoint when a run
# finishes. Omitted/empty = disabled. Each entry:
#   url:    where to POST (http/https, required)
#   on:     which outcomes deliver — any of success, failed, cancelled, skipped
#           (omitted = failed only)
#   secret: optional; sent as "Authorization: Bearer <secret>" (keep this file
#           chmod 600 if you set one — there is no env fallback for it)
# Delivery is best-effort: a slow or failing endpoint never fails or blocks a run.
# notifications:
#   - url: "https://example.com/janus-hook"
#     on: [failed, success]
#     secret: ""
